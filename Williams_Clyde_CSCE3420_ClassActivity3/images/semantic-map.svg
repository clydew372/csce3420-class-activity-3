<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
  <title id="title">Semantic HTML landmark map</title>
  <desc id="desc">A page diagram labeling header, navigation, main content, aside, and footer landmarks.</desc>
  <rect width="800" height="430" fill="#f4f7fb"/>
  <rect x="40" y="30" width="720" height="70" rx="12" fill="#1d4ed8"/>
  <text x="400" y="73" text-anchor="middle" font-family="sans-serif" font-size="28" fill="white">header</text>
  <rect x="40" y="115" width="720" height="48" rx="10" fill="#0f766e"/>
  <text x="400" y="147" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">nav</text>
  <rect x="40" y="178" width="470" height="165" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="275" y="220" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#172554">main</text>
  <text x="275" y="260" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#172554">section + article</text>
  <text x="275" y="294" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#172554">headings + content</text>
  <rect x="530" y="178" width="230" height="165" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="645" y="250" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#78350f">aside</text>
  <text x="645" y="286" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#78350f">related content</text>
  <rect x="40" y="358" width="720" height="45" rx="10" fill="#475569"/>
  <text x="400" y="388" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">footer</text>
</svg>
